<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>济州行程新增模块设计图</title>
    <style>
      :root {
        color: #193845;
        background: #eef4f5;
        font-family: Manrope, "Noto Sans SC", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      main {
        width: min(100%, 1540px);
      }

      .toolbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 7px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #46626d;
        font-size: 14px;
        font-weight: 600;
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 8px;
        background: #193845;
        color: white;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
      }

      .board {
        width: 100%;
        overflow: auto;
        border-radius: 18px;
        border: 1px solid #dde8ea;
        background: white;
        box-shadow: 0 24px 70px -38px rgba(25, 56, 69, 0.35);
      }

      img {
        width: 1540px;
        max-width: none;
        display: block;
      }

      @media (max-width: 720px) {
        body {
          padding: 16px;
          place-items: start;
        }

        .toolbar {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <div>
          <h1>济州行程新增模块设计图</h1>
          <p>三屏展示准备清单、当地注意事项、美食清单的落位和交互。</p>
        </div>
        <a href="./design.svg" target="_blank" rel="noreferrer">打开 SVG 原图</a>
      </div>
      <div class="board">
        <img src="./design.svg" alt="济州行程新增模块设计图" />
      </div>
    </main>
  </body>
</html>
