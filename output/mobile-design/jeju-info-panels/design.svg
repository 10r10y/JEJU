<svg width="1540" height="1120" viewBox="0 0 1540 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="phoneShadow" x="-30" y="-20" width="520" height="990" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#1e1a14" flood-opacity="0.22"/>
    </filter>
    <filter id="floatShadow" x="-20" y="-20" width="260" height="130" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#193845" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20" y="-20" width="390" height="170" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#193845" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b9dce3"/>
      <stop offset="1" stop-color="#b6d1d4"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef7ee"/>
      <stop offset="1" stop-color="#d9ead8"/>
    </linearGradient>
    <style>
      .label { font-family: Manrope, "Noto Sans SC", Arial, sans-serif; fill: #193845; }
      .serif { font-family: "Cormorant Garamond", "Noto Serif SC", Georgia, serif; fill: #193845; }
      .muted { fill: #7d97a1; }
      .soft { fill: #46626d; }
      .white { fill: #fff; }
      .smallcaps { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
      .title { font-size: 22px; font-weight: 800; }
      .subtitle { font-size: 12px; font-weight: 600; }
      .caption { font-size: 11px; font-weight: 600; }
      .body { font-size: 13px; font-weight: 650; }
      .tiny { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .tab { font-size: 12px; font-weight: 800; }
      .foodName { font-size: 17px; font-style: italic; font-weight: 700; }
      .stroke-soft { stroke: #c4d5d8; }
      .dash { stroke-dasharray: 4 5; }
    </style>
  </defs>

  <rect width="1540" height="1120" fill="#eef4f5"/>
  <text x="70" y="72" class="label" font-size="30" font-weight="800">济州行程新增模块设计图</text>
  <text x="70" y="104" class="label muted" font-size="14" font-weight="650">基于现有「地图 + 底部行程 sheet」结构，增加：准备清单、当地注意、美食清单</text>

  <!-- phone 1 -->
  <g transform="translate(70 150)" filter="url(#phoneShadow)">
    <rect width="440" height="900" rx="34" fill="#E4EDEF"/>
    <clipPath id="clipPrep"><rect width="440" height="900" rx="34"/></clipPath>
    <g clip-path="url(#clipPrep)">
      <rect width="440" height="430" fill="url(#sea)"/>
      <path d="M52 294 C96 238 140 220 204 224 C258 228 308 253 374 244 C405 240 432 244 466 268" stroke="#9f8db2" stroke-width="3" opacity=".65"/>
      <path d="M34 128 C88 150 128 164 163 204 C100 225 76 266 33 320 C-22 283 -30 184 34 128Z" stroke="#9f8db2" stroke-width="3" opacity=".62"/>
      <path d="M82 244 C160 166 278 152 370 216 C324 294 238 326 137 306 C94 298 66 278 82 244Z" fill="url(#land)" stroke="#b7cbb4" stroke-width="2"/>
      <path d="M130 266 C190 229 244 226 316 244" stroke="#c9d8c9" stroke-width="4"/>
      <path d="M127 286 C190 274 237 267 315 282" stroke="#c9d8c9" stroke-width="3"/>
      <path d="M176 215 C206 245 228 270 250 300" stroke="#d6dfcf" stroke-width="3"/>
      <path d="M112 236 L185 244 L242 229 L330 258" stroke="#5E94A2" stroke-width="4" stroke-linecap="round"/>
      <circle cx="116" cy="236" r="16" fill="#2f8f9d" stroke="#fff" stroke-width="3"/>
      <text x="116" y="241" text-anchor="middle" class="white serif" font-size="15" font-weight="800">1</text>
      <circle cx="185" cy="244" r="16" fill="#cf8a4c" stroke="#fff" stroke-width="3"/>
      <text x="185" y="249" text-anchor="middle" class="white serif" font-size="15" font-weight="800">2</text>
      <circle cx="242" cy="229" r="16" fill="#4f74a8" stroke="#fff" stroke-width="3"/>
      <text x="242" y="234" text-anchor="middle" class="white serif" font-size="15" font-weight="800">3</text>
      <circle cx="330" cy="258" r="16" fill="#6f9a64" stroke="#fff" stroke-width="3"/>
      <text x="330" y="263" text-anchor="middle" class="white serif" font-size="15" font-weight="800">4</text>

      <g filter="url(#floatShadow)">
        <rect x="19" y="16" width="182" height="84" rx="16" fill="rgba(252,253,253,.88)" stroke="rgba(255,255,255,.72)"/>
        <text x="35" y="36" class="label muted smallcaps">Itinerary</text>
        <text x="35" y="61" class="serif" font-size="25" font-weight="700">JEJU 济州岛</text>
        <text x="35" y="82" class="label soft caption">6.9 - 6.13 · 5天4晚</text>
      </g>

      <rect x="0" y="414" width="440" height="486" rx="30" fill="#fff"/>
      <rect x="199" y="429" width="42" height="5" rx="3" fill="#c4d5d8"/>
      <g transform="translate(22 452)">
        <text x="0" y="22" class="label muted smallcaps">Prepare</text>
        <text x="0" y="56" class="serif" font-size="46" font-weight="800" fill="#2f8f9d">16</text>
        <text x="47" y="56" class="label muted" font-size="17" font-weight="800">/24</text>
        <text x="88" y="24" class="label title">出发前准备</text>
        <text x="88" y="47" class="label soft subtitle">可勾选 · 自动保存 · 关联 D4 汉拿山</text>
      </g>
      <g transform="translate(22 530)">
        <rect x="0" y="0" width="70" height="32" rx="16" fill="#193845"/>
        <text x="35" y="21" text-anchor="middle" class="white tab">全部</text>
        <rect x="78" y="0" width="76" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="116" y="21" text-anchor="middle" class="label muted tab">未完成</text>
        <rect x="162" y="0" width="70" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="197" y="21" text-anchor="middle" class="label muted tab">必带</text>
        <rect x="240" y="0" width="104" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="292" y="21" text-anchor="middle" class="label muted tab">汉拿山</text>
      </g>
      <g transform="translate(22 584)">
        <rect width="396" height="112" rx="16" fill="#fff" stroke="#c4d5d8" stroke-dasharray="4 5" filter="url(#cardShadow)"/>
        <text x="16" y="28" class="label tiny" fill="#2f8f9d">证件与支付</text>
        <circle cx="20" cy="54" r="10" fill="#2f8f9d"/>
        <path d="M15 54.5 L19 58 L26 49" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="59" class="label body soft">护照、机票与酒店订单截图</text>
        <circle cx="20" cy="85" r="10" fill="#fff" stroke="#c4d5d8" stroke-width="2"/>
        <text x="38" y="90" class="label body">韩元现金、小额零钱、T-money 交通卡</text>
      </g>
      <g transform="translate(22 710)">
        <rect width="396" height="126" rx="16" fill="#fff" stroke="#c4d5d8" stroke-dasharray="4 5" filter="url(#cardShadow)"/>
        <text x="16" y="28" class="label tiny" fill="#6f9a64">D4 汉拿山</text>
        <circle cx="20" cy="55" r="10" fill="#fff" stroke="#c4d5d8" stroke-width="2"/>
        <text x="38" y="60" class="label body">登山鞋、薄外套、轻便雨衣</text>
        <circle cx="20" cy="87" r="10" fill="#fff" stroke="#c4d5d8" stroke-width="2"/>
        <text x="38" y="92" class="label body">补水、能量棒、预约二维码</text>
      </g>
    </g>
  </g>

  <!-- phone 2 -->
  <g transform="translate(560 150)" filter="url(#phoneShadow)">
    <rect width="440" height="900" rx="34" fill="#E4EDEF"/>
    <clipPath id="clipTips"><rect width="440" height="900" rx="34"/></clipPath>
    <g clip-path="url(#clipTips)">
      <rect width="440" height="430" fill="url(#sea)"/>
      <path d="M80 244 C160 166 278 152 370 216 C324 294 238 326 137 306 C94 298 66 278 80 244Z" fill="url(#land)" stroke="#b7cbb4" stroke-width="2"/>
      <path d="M110 238 L174 238 L235 262 L326 232" stroke="#b06d86" stroke-width="4" stroke-linecap="round"/>
      <circle cx="174" cy="238" r="16" fill="#b06d86" stroke="#fff" stroke-width="3"/>
      <text x="174" y="243" text-anchor="middle" class="white serif" font-size="15" font-weight="800">!</text>
      <circle cx="326" cy="232" r="16" fill="#cf8a4c" stroke="#fff" stroke-width="3"/>
      <text x="326" y="237" text-anchor="middle" class="white serif" font-size="15" font-weight="800">2</text>
      <g filter="url(#floatShadow)">
        <rect x="19" y="16" width="182" height="84" rx="16" fill="rgba(252,253,253,.88)" stroke="rgba(255,255,255,.72)"/>
        <text x="35" y="36" class="label muted smallcaps">Guide</text>
        <text x="35" y="61" class="serif" font-size="25" font-weight="700">当地注意</text>
        <text x="35" y="82" class="label soft caption">交通 · 礼仪 · 景点限制</text>
      </g>

      <rect x="0" y="414" width="440" height="486" rx="30" fill="#fff"/>
      <rect x="199" y="429" width="42" height="5" rx="3" fill="#c4d5d8"/>
      <g transform="translate(22 452)">
        <text x="0" y="22" class="label muted smallcaps">Tips</text>
        <text x="0" y="56" class="serif" font-size="46" font-weight="800" fill="#b06d86">6</text>
        <text x="38" y="56" class="label muted" font-size="17" font-weight="800">类</text>
        <text x="88" y="24" class="label title">当地习俗 / 注意事项</text>
        <text x="88" y="47" class="label soft subtitle">折叠阅读 · 重点置顶 · 可转准备项</text>
      </g>
      <g transform="translate(22 530)">
        <rect x="0" y="0" width="70" height="32" rx="16" fill="#193845"/>
        <text x="35" y="21" text-anchor="middle" class="white tab">重点</text>
        <rect x="78" y="0" width="70" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="113" y="21" text-anchor="middle" class="label muted tab">交通</text>
        <rect x="156" y="0" width="70" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="191" y="21" text-anchor="middle" class="label muted tab">餐饮</text>
        <rect x="234" y="0" width="70" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="269" y="21" text-anchor="middle" class="label muted tab">礼仪</text>
      </g>
      <g transform="translate(22 584)">
        <rect width="396" height="86" rx="16" fill="#fff8f5" stroke="#cf8a4c" stroke-width="1.5" filter="url(#cardShadow)"/>
        <text x="16" y="30" class="label" font-size="16" font-weight="800" fill="#cf8a4c">清晨机场建议打车</text>
        <text x="16" y="54" class="label body soft">6.13 早班机，公交不稳定；建议 05:30-05:45 出发。</text>
        <text x="328" y="30" class="label tiny" fill="#cf8a4c">D5</text>
      </g>
      <g transform="translate(22 688)">
        <rect width="396" height="76" rx="16" fill="#fff" stroke="#c4d5d8" stroke-dasharray="4 5" filter="url(#cardShadow)"/>
        <text x="16" y="29" class="label" font-size="16" font-weight="800">牛岛还车和末班船</text>
        <text x="16" y="53" class="label body soft">建议 16:00-16:30 还车，17:00 前坐船返回。</text>
        <path d="M370 31 L376 37 L382 31" stroke="#7d97a1" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(22 782)">
        <rect width="396" height="76" rx="16" fill="#fff" stroke="#c4d5d8" stroke-dasharray="4 5" filter="url(#cardShadow)"/>
        <text x="16" y="29" class="label" font-size="16" font-weight="800">部分餐厅有 break time</text>
        <text x="16" y="53" class="label body soft">美食卡显示营业时间，临近用餐前优先确认。</text>
        <path d="M370 31 L376 37 L382 31" stroke="#7d97a1" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- phone 3 -->
  <g transform="translate(1050 150)" filter="url(#phoneShadow)">
    <rect width="440" height="900" rx="34" fill="#E4EDEF"/>
    <clipPath id="clipFood"><rect width="440" height="900" rx="34"/></clipPath>
    <g clip-path="url(#clipFood)">
      <rect width="440" height="430" fill="url(#sea)"/>
      <path d="M80 244 C160 166 278 152 370 216 C324 294 238 326 137 306 C94 298 66 278 80 244Z" fill="url(#land)" stroke="#b7cbb4" stroke-width="2"/>
      <path d="M126 238 L186 252 L252 232 L337 256" stroke="#2f8f9d" stroke-width="4" stroke-linecap="round"/>
      <circle cx="126" cy="238" r="16" fill="#2f8f9d" stroke="#fff" stroke-width="3"/>
      <text x="126" y="243" text-anchor="middle" class="white serif" font-size="15" font-weight="800">1</text>
      <circle cx="252" cy="232" r="16" fill="#4f74a8" stroke="#fff" stroke-width="3"/>
      <text x="252" y="237" text-anchor="middle" class="white serif" font-size="15" font-weight="800">3</text>
      <circle cx="186" cy="252" r="15" fill="#fff" stroke="#193845" stroke-width="2.5"/>
      <path d="M181 247 h12 M184 247 v13 M190 247 v13" stroke="#193845" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="337" cy="256" r="15" fill="#fff" stroke="#193845" stroke-width="2.5"/>
      <path d="M332 251 h12 M335 251 v13 M341 251 v13" stroke="#193845" stroke-width="1.7" stroke-linecap="round"/>
      <g filter="url(#floatShadow)">
        <rect x="19" y="16" width="196" height="84" rx="16" fill="rgba(252,253,253,.88)" stroke="rgba(255,255,255,.72)"/>
        <text x="35" y="36" class="label muted smallcaps">Food map</text>
        <text x="35" y="61" class="serif" font-size="25" font-weight="700">美食清单</text>
        <text x="35" y="82" class="label soft caption">店名 · 营业时间 · 加入行程</text>
      </g>

      <rect x="0" y="414" width="440" height="486" rx="30" fill="#fff"/>
      <rect x="199" y="429" width="42" height="5" rx="3" fill="#c4d5d8"/>
      <g transform="translate(22 452)">
        <text x="0" y="22" class="label muted smallcaps">Food</text>
        <text x="0" y="56" class="serif" font-size="46" font-weight="800" fill="#cf8a4c">8</text>
        <text x="38" y="56" class="label muted" font-size="17" font-weight="800">家</text>
        <text x="88" y="24" class="label title">美食清单</text>
        <text x="88" y="47" class="label soft subtitle">地图联动 · 营业状态 · 可加入行程</text>
      </g>
      <g transform="translate(22 530)">
        <rect x="0" y="0" width="70" height="32" rx="16" fill="#193845"/>
        <text x="35" y="21" text-anchor="middle" class="white tab">全部</text>
        <rect x="78" y="0" width="76" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="116" y="21" text-anchor="middle" class="label muted tab">营业中</text>
        <rect x="162" y="0" width="70" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="197" y="21" text-anchor="middle" class="label muted tab">咸德</text>
        <rect x="240" y="0" width="70" height="32" rx="16" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="275" y="21" text-anchor="middle" class="label muted tab">牛岛</text>
      </g>
      <g transform="translate(22 584)">
        <rect width="396" height="122" rx="16" fill="#fff" stroke="#c4d5d8" stroke-dasharray="4 5" filter="url(#cardShadow)"/>
        <text x="16" y="31" class="serif foodName" fill="#cf8a4c">海女之家</text>
        <rect x="300" y="16" width="66" height="24" rx="12" fill="#e8f4f1"/>
        <text x="333" y="32" text-anchor="middle" class="label tiny" fill="#2f8f9d">营业中</text>
        <text x="16" y="56" class="label body soft">城山附近 · 10:00-20:00 · 海鲜锅 / 鲍鱼粥</text>
        <text x="16" y="81" class="label body">适合作为 D2 牛岛前后午餐备选。</text>
        <rect x="16" y="94" width="108" height="26" rx="13" fill="#193845"/>
        <text x="70" y="111" text-anchor="middle" class="white caption">加入 D2 午餐</text>
        <rect x="132" y="94" width="66" height="26" rx="13" fill="#eef4f5" stroke="#dde8ea"/>
        <text x="165" y="111" text-anchor="middle" class="label muted caption">收藏</text>
      </g>
      <g transform="translate(22 724)">
        <rect width="396" height="112" rx="16" fill="#fff" stroke="#c4d5d8" stroke-dasharray="4 5" filter="url(#cardShadow)"/>
        <text x="16" y="31" class="serif foodName" fill="#cf8a4c">咸德黑猪肉</text>
        <rect x="300" y="16" width="66" height="24" rx="12" fill="#f7eee9"/>
        <text x="333" y="32" text-anchor="middle" class="label tiny" fill="#cf8a4c">晚餐</text>
        <text x="16" y="56" class="label body soft">咸德海滩 · 17:00-23:00 · 黑猪肉 / 泡菜汤</text>
        <text x="16" y="81" class="label body">酒店附近，适合 D1 到达后轻松吃。</text>
      </g>
    </g>
  </g>

  <g transform="translate(92 1088)">
    <circle cx="0" cy="-5" r="5" fill="#193845"/>
    <text x="16" y="0" class="label soft" font-size="13" font-weight="650">模块切换放在 DayTabs 上方：行程保留原地图路线，准备/注意以资料流展示，美食支持地图 marker 与加入行程。</text>
  </g>
</svg>
